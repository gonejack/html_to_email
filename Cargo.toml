[package]
name = "html_to_email"
license = "MIT"
version = "1.0.6"
edition = "2024"
description = "A command line converts .html file to .eml file."
authors = ["John <igonejack@gmail.com>"]
repository = "https://github.com/gonejack/html_to_email"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
clap = { version = "4", features = ["derive"] }
lettre = "0.11.22"
visdom = { version = "1.0.4", features = ["full"] }
time = { version = "0.3.47", features = ["macros"] }
nu-ansi-term = "0.50"