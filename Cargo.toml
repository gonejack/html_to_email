[package]
name = "html_to_email"
license = "MIT"
version = "1.0.4"
edition = "2018"
description = "A command line converts .html file to .eml file."
authors = ["John <igonejack@gmail.com>"]
repository = "https://github.com/gonejack/html_to_email"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
log = "0.4"
env_logger = "0.11.5"
lettre = "0.11.11"
visdom = { version = "1.0.2", features = ["full"] }
getopts = "0.2"
